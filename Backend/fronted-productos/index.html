<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Productos</title>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <div class="container">


        <header class="header">

            <div>

                <h1>
                    Sistema Inteligente de Productos
                </h1>

                <p>
                    Gestión y control de inventario
                </p>

            </div>

        </header>



        <div class="contenido">



            <section class="card-formulario">

                <h2>
                    Registrar Producto
                </h2>

                <div class="formulario">

                    <input type="hidden" id="id">

                    <div class="input-group">

                        <input type="text" id="codigo" placeholder="Código" onblur="validarCodigo()">

                        <small id="mensajeCodigo">

                        </small>

                    </div>

                    <input type="text" id="nombre" placeholder="Nombre">

                    <input type="text" id="descripcion" placeholder="Descripción">

                    <input type="number" id="precio" placeholder="Precio">

                    <input type="number" id="cantidad" placeholder="Cantidad">

                    <select id="estado">

                        <option value="Activo">
                            Activo
                        </option>

                        <option value="Inactivo">
                            Inactivo
                        </option>

                    </select>

                    <button onclick="guardarProducto()">

                        Guardar Producto

                    </button>

                </div>

            </section>

            <!-- TABLA -->

            <section class="card-tabla">

                <div class="tabla-header">

                    <h2>
                        Lista de Productos
                    </h2>

                </div>

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                            <th>Estado</th>
                            <th>Acciones</th>

                        </tr>

                    </thead>

                    <tbody id="tablaProductos">

                    </tbody>

                </table>

            </section>

        </div>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
