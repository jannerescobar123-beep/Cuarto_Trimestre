version: '3.9'

services:

  db:

    image: mysql:8.0

    container_name: mysql-productos

    restart: always

    environment:

      MYSQL_ROOT_PASSWORD: root

      MYSQL_DATABASE: tienda_productos

      MYSQL_USER: appuser

      MYSQL_PASSWORD: apppass

    ports:

      - "3307:3306"

  app:

    build: .

    container_name: api-productos

    restart: always

    depends_on:

      - db

    ports:

      - "8080:8080"